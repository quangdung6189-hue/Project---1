services:
  - type: web
    name: ecovalues-backend
    env: node
    rootDir: sinhvien-taiche-fullstack/backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecovalues-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://project-1-ybxi.onrender.com,http://localhost:5173
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200

databases:
  - name: ecovalues-db
    databaseName: ecovalues
    user: ecovalues_user
    plan: free
